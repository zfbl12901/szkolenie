---

# Advanced PostgreSQL Training for Data Engineers

This training is designed for Data Analysts looking to advance their skills toward Data Engineering, with a focus on SQL optimization, performance, BI modeling, and data pipeline implementation.

---

## Module 1 — Query Optimization

### 🎯 Objectives
- Understand how PostgreSQL actually executes a query.
- Diagnose and optimize SQL performance on large volumes.

### 📚 Content
- **EXPLAIN / EXPLAIN ANALYZE** : reading and interpreting execution plans.
- Cost analysis, row estimates, loops, timings.
- Join types : nested loop, hash join, merge join.
- Scans : seq scan, index scan, bitmap scan.
- **Advanced indexing** : multicolumn, partial, expressions, GIN/GiST/BRIN.
- **Partitioning** and best practices.
- **CTE** : materialized vs non-materialized.
- **Visual analysis** with explain.dalibo.com.

---

## Module 2 — Performance & Scalability

### 🎯 Objectives
- Know how to configure PostgreSQL for heavy workloads.
- Understand the impact of system parameters on performance.

### 📚 Content
- Key parameters : \`work_mem\`, \`shared_buffers\`, \`effective_cache_size\`.
- WAL : \`max_wal_size\`, \`checkpoint_timeout\`, compression.
- Vacuum & autovacuum in depth.
- Parallel queries : operation and tuning.
- Cache and buffer management.
- Practical optimization for large datasets.

---

## Module 3 — Modeling & Data Engineering

### 🎯 Objectives
- Structure data for analytics, scalability, and data pipelines.

### 📚 Content
- BI modeling : **Star Schema / Snowflake**.
- Normalization / denormalization according to analytical needs.
- Techniques for **big tables** (100M – 1B rows).
- Retention & archival strategies.
- Data pipelines :
  - Ingestion
  - ELT / ETL in SQL
  - Change Data Capture (CDC)
  - Logical replication for scalability and HA.

---

## Module 4 — Monitoring, Tools & Maintenance

### 🎯 Objectives
- Monitor, maintain, and diagnose a PostgreSQL cluster in production.

### 📚 Content
- Monitoring tools :
  - \`pg_stat_statements\`
  - \`pg_stat_activity\`
  - pgBadger
  - Grafana + Prometheus
  - Datadog / New Relic
- Backup & restore :
  - \`pg_dump\` / \`pg_restore\`
  - \`pg_basebackup\`
  - Filesystem snapshots
- Proactive maintenance :
  - Index, bloat, and fragmentation monitoring
  - Autovacuum and parameter adjustments

---

## Module 5 — Practical Workshop & Internal Certification

### 🎯 Objectives
- Put into practice all the knowledge acquired in the training.

### 🛠 Workshop : Build a Mini Data Warehouse
- **Modeling** a Star Schema.
- **Import** a massive dataset.
- **Partitioning** and smart indexing.
- **Optimization** of 10 queries with benchmarks.
- **Complete analysis** via explain.dalibo.com.
- **Setting up a simple ELT pipeline**.
- **Monitoring** and evolving statistics.
- **Documentation** and oral presentation.

### 🏁 Final Result
At the end of this training, the learner masters :
- Execution plans and SQL optimization (expert level)
- PostgreSQL configuration and tuning
- BI / DWH design
- Data pipeline creation
- Monitoring and maintenance tools for production`;

    <script>
        // Dark/Light mode management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        // SVG icons for sun and moon
        const sunIcon = '<path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>';
        const moonIcon = '<path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/>';
        
        // Load saved preference
        const savedTheme = localStorage.getItem('postgresql-theme') || 'light';
        
        function applyTheme(theme) {
            const highlightLight = document.getElementById('highlight-light');
            const highlightDark = document.getElementById('highlight-dark');
            
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.innerHTML = moonIcon;
                themeText.textContent = 'Dark';
                if (highlightLight) highlightLight.disabled = true;
                if (highlightDark) highlightDark.disabled = false;
            } else {
                document.body.classList.remove('dark-mode');
                themeIcon.innerHTML = sunIcon;
                themeText.textContent = 'Light';
                if (highlightLight) highlightLight.disabled = false;
                if (highlightDark) highlightDark.disabled = true;
            }
            localStorage.setItem('postgresql-theme', theme);
        }
        
        // Apply theme on load
        applyTheme(savedTheme);
        
        // Toggle on click
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });
    </script>
