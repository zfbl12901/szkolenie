<!DOCTYPE html>

    <link rel="stylesheet" href="../styles.css">

        // Apply theme immediately to avoid flash
        (function() {
            const savedTheme = localStorage.getItem('postgresql-theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="highlight-dark" disabled>
</head>
<body>
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="../index.html">📘 Advanced PostgreSQL</a>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html">Course Plan</a></li>
                    <li><a href="module1.html" class="active">Module 1</a></li>
                    <li class="lang-selector">
                        <a href="../../FR/Module 1 - Fondamentaux essentiels/module1.html">FR</a>
                        <a href="module1.html" class="active">EN</a>
                    </li>
                    <li class="theme-toggle" id="themeToggle" title="Toggle between light and dark mode">
                        <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>

    <main class="content-container">
        <article class="markdown-content" id="content">
            <div class="loading">Loading content...</div>
        </article>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025 Advanced PostgreSQL Training — Data Analyst → Data Engineer</p>
    </footer>

    <script>
        // Marked configuration
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // Load Markdown content from file
        fetch('index.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error loading Markdown file');
                }
                return response.text();
            })
            .then(markdown => {
                // Convert and display content
                document.getElementById('content').innerHTML = marked.parse(markdown);
                
                // Add IDs to headings for navigation
                document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading, index) => {
                    if (!heading.id) {
                        // Create an ID based on the heading text
                        const id = heading.textContent
                            .toLowerCase()
                            .replace(/[^\w\s-]/g, '')
                            .replace(/\s+/g, '-')
                            .replace(/-+/g, '-')
                            .trim();
                        heading.id = id || 'heading-' + index;
                    }
                });

                // Add anchors for internal links
                document.querySelectorAll('a[href^="#"]').forEach(link => {
                    link.addEventListener('click', function(e) {
                        const targetId = this.getAttribute('href').substring(1);
                        const targetElement = document.getElementById(targetId);
                        if (targetElement) {
                            e.preventDefault();
                            targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = 
                    '<div class="error"><h2>Loading Error</h2><p>Unable to load content. Please verify that the index.md file is present in the same directory.</p></div>';
            });
    </script>

    <style>
        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1.2rem;
        }

        .error {
            padding: 2rem;
            background-color: #fee;
            border: 2px solid #fcc;
            border-radius: 8px;
            color: #c33;
        }
    </style>

    <script>
        // Dark/Light mode management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        // SVG icons for sun and moon
        const sunIcon = '<path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>';
        const moonIcon = '<path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/>';
        
        // Load saved preference
        const savedTheme = localStorage.getItem('postgresql-theme') || 'light';
        
        function applyTheme(theme) {
            const highlightLight = document.getElementById('highlight-light');
            const highlightDark = document.getElementById('highlight-dark');
            
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.innerHTML = moonIcon;
                themeText.textContent = 'Dark';
                if (highlightLight) highlightLight.disabled = true;
                if (highlightDark) highlightDark.disabled = false;
            } else {
                document.body.classList.remove('dark-mode');
                themeIcon.innerHTML = sunIcon;
                themeText.textContent = 'Light';
                if (highlightLight) highlightLight.disabled = false;
                if (highlightDark) highlightDark.disabled = true;
            }
            localStorage.setItem('postgresql-theme', theme);
        }
        
        // Apply theme on load
        applyTheme(savedTheme);
        
        // Toggle on click
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });
    </script>
</body>
</html>
